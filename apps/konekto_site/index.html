<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecionando — Sevvn</title>
<meta name="description" content="Redirecionando para o site oficial da Sevvn.">
<meta http-equiv="refresh" content="0; url=https://sevvn-site.vercel.app">
<style>
  :root {
    color-scheme: light;
    --bg: #fafaf9;
    --surface: #ffffff;
    --border: rgba(22, 24, 29, 0.1);
    --ink: #16181d;
    --muted: #5b5f68;
    --primary: #ff2e88;
    --font: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 40px 80px -32px rgba(22, 24, 29, 0.18);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  p {
    margin: 0;
    color: var(--muted);
    line-height: 1.6;
  }
  a {
    color: var(--primary);
    font-weight: 700;
    text-decoration: none;
  }
</style>
</head>
<body>
  <script>
    const target = new URL('https://sevvn-site.vercel.app');
    const current = new URL(window.location.href);
    if (current.search) {
      current.searchParams.forEach((value, key) => target.searchParams.set(key, value));
    }
    window.location.replace(target.toString());
  </script>
  <div class="card">
    <h1>Redirecionando para o site oficial</h1>
    <p>
      Esta versao antiga do site ficou apenas como compatibilidade.
      Se o redirecionamento nao acontecer automaticamente,
      <a href="https://sevvn-site.vercel.app">clique aqui</a>.
    </p>
  </div>
</body>
</html>
