<script>
        // Micro-interaction: Mouse/Gyro parallax effect
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('[data-alt]');
            const x = (e.clientX - window.innerWidth / 2) / 50;
            const y = (e.clientY - window.innerHeight / 2) / 50;
            bg.style.transform = `scale(1.1) translate(${x}px, ${y}px)`;
        });

        // Simulate transition to home screen after 4 seconds
        setTimeout(() => {
            document.body.classList.add('transition-opacity', 'duration-1000', 'opacity-0');
            // In a real app, window.location.href = '/home' would go here
        }, 4000);
    </script>
