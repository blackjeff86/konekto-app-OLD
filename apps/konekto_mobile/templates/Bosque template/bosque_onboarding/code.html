<!-- Subtle atmospheric particles script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.body;
            const particleCount = 12;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'absolute rounded-full pointer-events-none z-10 bg-white/20 blur-xl';
                const size = Math.random() * 40 + 20;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                const duration = Math.random() * 10 + 15;
                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 0 },
                    { transform: `translate(${Math.random() * 100 - 50}px, ${Math.random() * -200 - 50}px) scale(1.5)`, opacity: 0.3 },
                    { transform: `translate(${Math.random() * 200 - 100}px, ${Math.random() * -400 - 100}px) scale(1)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    iterations: Infinity,
                    easing: 'ease-in-out'
                });

                container.appendChild(particle);
            }
        });
    </script>
