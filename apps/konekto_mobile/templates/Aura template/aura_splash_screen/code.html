<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            40% { opacity: 1; transform: translateY(0); }
            60% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        @keyframes subtleDrift {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.1); }
        }

        .fade-in-up {
            animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .letter-spacing-widest {
            letter-spacing: 0.4em;
        }

        .aura-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            background-size: 200% 100%;
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background overflow-hidden h-screen w-screen flex flex-col justify-center items-center">
<!-- Splash Screen Container -->
<main class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 z-0 opacity-40">
<div class="absolute top-[-10%] left-[-10%] w-[60%] h-[60%] rounded-full bg-primary-fixed blur-[120px]"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[50%] h-[50%] rounded-full bg-secondary-container blur-[100px]"></div>
</div>
<!-- Central Identity -->
<div class="relative z-10 flex flex-col items-center">
<!-- Animated Logo -->
<div class="fade-in-up flex flex-col items-center">
<h1 class="font-display-lg text-display-lg text-primary letter-spacing-widest mb-2">
                    AURA
                </h1>
<!-- Tagline with slight delay -->
<p class="font-label-caps text-label-caps text-outline uppercase tracking-[0.2em] opacity-0 [animation-delay:400ms] [animation-fill-mode:forwards]" style="animation: fadeInUp 1s ease 0.5s forwards;">
                    Essential Hospitality
                </p>
</div>
<!-- Loading Indicator -->
<div class="mt-xl h-[1px] w-32 bg-outline-variant relative overflow-hidden">
<div class="absolute inset-0 bg-primary aura-shimmer w-1/2 rounded-full" style="animation: shimmer-move 2s infinite ease-in-out;"></div>
</div>
</div>
<!-- Footer Branding -->
<div class="absolute bottom-12 w-full text-center fade-in-up" style="animation-delay: 800ms;">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary" style="font-size: 16px;">verified</span>
<span class="font-body-sm text-body-sm text-on-surface-variant">The Elite Collection</span>
</div>
<p class="font-label-caps text-label-caps text-outline-variant">EST. 1924</p>
</div>
<!-- Decorative Foreground Detail -->
<div class="absolute inset-0 pointer-events-none border-[1px] border-outline-variant/10 m-6 rounded-xl"></div>
</main>
<!-- Background Animation (Optional Subtle Layer) -->
<div class="fixed inset-0 z-[-1] pointer-events-none opacity-20">
<div class="absolute inset-0 w-full h-full opacity-30 pointer-events-none bg-[url('https://grainy-gradients.vercel.app/noise.svg')]" id="grain"></div>
</div>
<script>
        // Simple loading bar animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shimmer-move {
                0% { transform: translateX(-100%); }
                100% { transform: translateX(200%); }
            }
        `;
        document.head.appendChild(style);

        // Simulate app entry redirect
        // In a real app, this would check auth or state
        setTimeout(() => {
            console.log('Transitioning to Dashboard...');
            // Example: window.location.href = '/dashboard';
        }, 3500);

        // Vanilla interaction: Logo hover glow
        const logo = document.querySelector('h1');
        logo.addEventListener('mousemove', (e) => {
            const { offsetX, offsetY } = e;
            const x = (offsetX / logo.clientWidth) * 100;
            const y = (offsetY / logo.clientHeight) * 100;
            logo.style.textShadow = `${(x-50)/10}px ${(y-50)/10}px 15px rgba(79, 55, 138, 0.2)`;
        });
        logo.addEventListener('mouseleave', () => {
            logo.style.textShadow = 'none';
        });
    </script>
</body></html>
